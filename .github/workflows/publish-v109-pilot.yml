name: Publish RKA Companion v1.0.9 PILOT

on:
  push:
    branches: [main]
    paths:
      - 'releases/v1.0.9/RKA-Windows-Companion-v1.0.9-PILOT.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate checksum and publish public pilot release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd releases/v1.0.9 && sha256sum --check SHA256SUMS)
          if gh release view v1.0.9-PILOT >/dev/null 2>&1; then
            echo 'Replacing still-unapproved public v1.0.9 PILOT asset with validated build.'
            gh release upload v1.0.9-PILOT releases/v1.0.9/RKA-Windows-Companion-v1.0.9-PILOT.zip --clobber
            exit 0
          fi
          gh release create v1.0.9-PILOT \
            releases/v1.0.9/RKA-Windows-Companion-v1.0.9-PILOT.zip \
            --title 'Retro Knights Windows Companion v1.0.9 — PILOT' \
            --prerelease \
            --notes-file releases/v1.0.9/RELEASE-NOTES.md \
            --target "$GITHUB_SHA"
